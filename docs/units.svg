<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="340" rx="10" fill="#f6f8fa"/>

  <text x="32" y="42" font-size="17" font-weight="600" fill="#1f2328">What a logical pixel is worth</text>
  <text x="32" y="66" font-size="13.5" fill="#57606a">Bind a surface to the camera and the dp &#8596; world-unit rate stops being a guess.</text>

  <!-- camera -->
  <g>
    <path d="M72 178 L112 156 L112 200 Z" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
    <rect x="110" y="162" width="26" height="32" rx="3" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
    <text x="104" y="228" font-size="12" fill="#57606a" text-anchor="middle">camera</text>
  </g>

  <!-- frustum -->
  <path d="M112 178 L470 92" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <path d="M112 178 L470 268" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <text x="300" y="150" font-size="11.5" fill="#8250df" text-anchor="middle">field of view</text>

  <!-- the bound surface -->
  <rect x="452" y="92" width="34" height="176" rx="3" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="469" y="292" font-size="12" fill="#8250df" text-anchor="middle">surface</text>
  <text x="469" y="308" font-size="11.5" fill="#57606a" text-anchor="middle">at `distance`</text>

  <!-- the derivation -->
  <path d="M510 180 L566 180" stroke="#57606a" stroke-width="1.8" fill="none" marker-end="url(#gray)"/>

  <g>
    <rect x="574" y="112" width="292" height="132" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="594" y="140" font-size="13" font-weight="600" fill="#1f2328">Layout3dMetrics</text>
    <text x="594" y="166" font-size="12.5" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">unitsPerLogicalPixel</text>
    <text x="594" y="190" font-size="12" fill="#57606a">carried on the owner, beside the basis</text>
    <text x="594" y="216" font-size="12.5" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">metrics.dp(48)</text>
    <text x="594" y="234" font-size="11.5" fill="#57606a">read inside performLayout &#8212; no BuildContext</text>
  </g>

  <text x="450" y="330" font-size="12" fill="#57606a" text-anchor="middle">Type sizes, corner radii, touch targets and elevation all spend this one number.</text>

  <defs>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
