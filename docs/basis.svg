<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="360" rx="10" fill="#f6f8fa"/>

  <text x="32" y="42" font-size="17" font-weight="600" fill="#1f2328">The basis decides what &#8220;down&#8221; means</text>
  <text x="32" y="66" font-size="13.5" fill="#57606a">One layout tree, two planes. The arithmetic never changes &#8212; only the axes it is spent on.</text>

  <!-- ── left: xy, standing up ── -->
  <g>
    <text x="200" y="106" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">LayoutBasis3d.xy</text>
    <text x="200" y="126" font-size="12" fill="#57606a" text-anchor="middle">a panel facing the viewer</text>

    <rect x="106" y="146" width="188" height="150" rx="4" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>

    <rect x="122" y="162" width="156" height="34" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
    <rect x="122" y="204" width="156" height="34" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
    <rect x="122" y="246" width="156" height="34" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>

    <!-- down arrow -->
    <path d="M330 158 L330 286" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#red2)"/>
    <text x="340" y="226" font-size="12" fill="#cf222e">down</text>
  </g>

  <!-- divider -->
  <path d="M450 120 L450 300" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ── right: xz, on the ground ── -->
  <g>
    <text x="672" y="106" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">LayoutBasis3d.xz</text>
    <text x="672" y="126" font-size="12" fill="#57606a" text-anchor="middle">the same tree, on the ground</text>

    <!-- ground plane in perspective -->
    <path d="M560 176 L790 152 L840 268 L540 300 Z" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>

    <!-- rows advancing toward the viewer -->
    <path d="M572 186 L780 164 L790 190 L576 213 Z" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
    <path d="M578 221 L792 198 L804 228 L583 252 Z" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
    <path d="M585 260 L806 236 L819 270 L590 295 Z" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>

    <!-- down arrow, receding -->
    <path d="M520 168 L500 292" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#red2)"/>
    <text x="494" y="232" font-size="12" fill="#cf222e" text-anchor="end">down</text>
    <text x="672" y="332" font-size="12" fill="#57606a" text-anchor="middle">&#8220;down&#8221; now walks toward the viewer</text>
  </g>

  <defs>
    <marker id="red2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#cf222e"/>
    </marker>
  </defs>
</svg>
