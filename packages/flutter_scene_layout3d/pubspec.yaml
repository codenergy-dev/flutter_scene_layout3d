name: flutter_scene_layout3d
description: Flutter's box layout protocol in three dimensions for flutter_scene. Constraints go down, sizes go up, and the parent positions the child, on a freely transformable 3D plane.
repository: https://github.com/bdero/flutter_scene
homepage: https://github.com/bdero/flutter_scene
version: 0.5.0

topics:
  - layout
  - 3d
  - ui
  - gamedev

platforms:
  macos:
  ios:
  android:
  windows:
  linux:
  web:

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.29.0-1.0.pre.242"

dependencies:
  characters: ^1.3.0
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
