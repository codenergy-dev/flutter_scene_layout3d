name: flutter_scene_material3d
description: >-
  Material Design 3 built as real geometry on flutter_scene_layout3d. The
  token families, a theme both the widget and the imperative layer can read,
  and the depth scales Material does not have.
repository: https://github.com/codenergy-dev/flutter_scene_layout3d
homepage: https://github.com/codenergy-dev/flutter_scene_layout3d
version: 0.1.0

topics:
  - material
  - layout
  - 3d
  - ui
  - gamedev

platforms:
  macos:
  ios:
  android:
  windows:
  linux:
  web:

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.29.0-1.0.pre.242"

dependencies:
  flutter:
    sdk: flutter
  # A real dependency since phase 2: `initializeMaterial3d` awaits
  # `Scene.initializeStaticResources()` and loads the compiled panel shader,
  # which is the one call standing between a themed component and a picture.
  flutter_scene: ^0.23.0
  flutter_scene_layout3d:
    path: ../flutter_scene_layout3d
  # What `ColorScheme3d.fromSeed` generates a scheme with, and the same
  # library Flutter's own `ColorScheme.fromSeed` is built out of — which is
  # what makes the drift test in `test/color_scheme_test.dart` an exact
  # comparison rather than a tolerance. It is already in the graph of every
  # Flutter application: `package:flutter` depends on it directly and the SDK
  # pins it, so naming it here adds no package.
  #
  # **The pin is the SDK's, so bump this when Flutter bumps that.** A caret on
  # a 0.x version means `>=0.13.0 <0.14.0`; the day
  # `packages/flutter/pubspec.yaml` moves to 0.14.0, this constraint is what
  # refuses to resolve, and the fix is to move it rather than to loosen it.
  material_color_utilities: ^0.13.0
  # The one matrix this package writes itself: `NodeShift3d` stretches a
  # slider's active track on the node tier. `vector_math`, never
  # `vector_math_64` — see docs/engine-rules.md.
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# No `flutter:` section, and deliberately no build hook. The panel shader
# every component draws through belongs to flutter_scene_layout3d, which
# compiles it from its own hook for whatever application depends on it. A
# second library calling `buildEngineAssets` would put two copies of the
# engine's shaders in every app that used it; see docs/engine-rules.md.
