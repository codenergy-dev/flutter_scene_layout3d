name: layout3d_gallery
description: >-
  The example app for flutter_scene_layout3d and flutter_scene_material3d:
  a Material screen standing up, the same catalogue lying on a table, and a
  scrolling list of real meshes, all in one scene and all hit-testable.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hooks: ^2.0.0
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  flutter_scene_layout3d:
    path: ../../packages/flutter_scene_layout3d
  flutter_scene_material3d:
    path: ../../packages/flutter_scene_material3d
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  # The catalogue draws icons out of the MaterialIcons font, and Icon3d
  # rasterizes one code point of it through the glyph atlas.
  uses-material-design: true
  assets:
    # Everything hook/build.dart generates, loaded by source path.
    - flutter_scene_generated/
