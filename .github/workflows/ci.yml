name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      # The suite is headless. Anything needing a GPU context — the decoration
      # painter, a glyph atlas — is a seam with no in-tree implementation, and
      # is deliberately not covered here. See AGENTS.md.
      - name: Test
        run: flutter test
        working-directory: packages/flutter_scene_layout3d
