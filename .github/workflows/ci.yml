name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      # The package suite is headless: arithmetic only, no frame is drawn.
      - name: Test
        run: flutter test
        working-directory: packages/flutter_scene_layout3d

      # Also headless, and for the same reason: the Material package is
      # tokens, a theme and the arithmetic between them. Nothing here draws.
      - name: Test the Material package
        run: flutter test
        working-directory: packages/flutter_scene_material3d

  render:
    name: Render tests
    # macos-14 and later are Apple silicon with a real GPU, which Flutter GPU
    # needs. A software backend has not been tried; until it has, do not
    # assume a cheaper runner works.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve workspace dependencies
        run: flutter pub get

      # Draws real geometry through the layout boxes and probes the frame at
      # the pixels layout says to check. The panel shader is compiled by the
      # layout package's own build hook, so a syntax error in it fails any
      # build; this is the only lane that runs the compiled shader, so a
      # shader that compiles and draws the wrong thing fails here alone.
      - name: Render probes
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/render_test.dart \
            -d macos --enable-flutter-gpu
        working-directory: examples/render_probe
