include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - packages/*/build/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    asset_does_not_exist: ignore
    asset_directory_does_not_exist: ignore
    invalid_dependency: ignore
